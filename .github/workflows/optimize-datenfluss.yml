name: Datenfluss-Schaubild als PNG optimieren
on:
  push:
    paths:
      - '.github/workflows/optimize-datenfluss.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: PNG verlustarm optimieren ohne Bildgröße zu ändern
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from io import BytesIO
          from pathlib import Path
          path = Path('datenfluss-github-browser-pdf.png')
          before = path.read_bytes()
          with Image.open(path) as im:
              im.load()
              image = im.copy()
          candidates = [before]
          def add(im):
              buffer = BytesIO()
              im.save(buffer, format='PNG', optimize=True, compress_level=9)
              candidates.append(buffer.getvalue())
          add(image)
          if image.mode in ('RGB', 'RGBA'):
              # 256 colors generally preserve clear diagram text and shapes.
              add(image.quantize(colors=256, method=Image.Quantize.FASTOCTREE, dither=Image.Dither.NONE))
          best = min(candidates, key=len)
          if len(best)<len(before):
              path.write_bytes(best)
          print(f'Bildabmessungen: {image.size[0]}x{image.size[1]}')
          print(f'Vorher: {len(before):,} Bytes; nachher: {min(len(best),len(before)):,} Bytes')
          PY
      - name: Optimiertes PNG speichern
        run: |
          if ! git diff --quiet -- datenfluss-github-browser-pdf.png; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add datenfluss-github-browser-pdf.png
            git commit -m 'Grafik: Datenfluss-Schaubild PNG komprimieren'
            git push
          else
            echo 'PNG bereits optimal.'
          fi
